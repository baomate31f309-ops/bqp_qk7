services:
  - type: web
    name: qt-document-workflow
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: auto
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
